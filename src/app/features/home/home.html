<div class="page home">
  <section class="hero-scroll" id="apresentacao" aria-labelledby="home-title">
    <h1 id="home-title" class="hero-title">André Duarte, desenvolvedor front-end</h1>
    <div class="hero"><div class="hero-art"><app-interface-workshop /></div></div>
  </section>
</div>
@if (hasJourney()) {
  <section id="percurso" aria-label="Trajetória, do presente ao começo">
    <app-arena-story />
    <app-project-story [project]="projects[0]" next="#projeto-wakawa" nextLabel="Conhecer o waka’wã" />
    <app-project-story [project]="projects[1]" next="#experiencias-anteriores" nextLabel="Seguir a trajetória" />
    <section class="previous-work" id="experiencias-anteriores" aria-label="Experiências anteriores à Trade Arena">
      <app-timeline />
    </section>
  </section>
}
