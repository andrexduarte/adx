<ng-template #links>
  <nav aria-label="Links do rodapé" [class.centered]="showPortrait()">
    <a href="https://github.com/andrexduarte" target="_blank" rel="noopener">GitHub ↗</a
    ><a href="https://www.linkedin.com/in/andrexdev/" target="_blank" rel="noopener">LinkedIn ↗</a
    ><a href="https://wa.me/5531992930696" target="_blank" rel="noopener">WhatsApp ↗</a
    ><a href="https://www.instagram.com/andrexduarte/" target="_blank" rel="noopener">Instagram ↗</a
    ><a href="https://fediring.net/" target="_blank" rel="noopener">Fediring ↗</a>
    @if (config.fediringMember) {
      <a
        href="https://fediring.net/previous?host=andre.is-a.dev"
        aria-label="Site anterior do Fediring"
        >← Anterior</a
      >
    }
    <a href="https://fediring.net/random" target="_blank" rel="noopener">Passear pela web ↗</a>
    @if (config.fediringMember) {
      <a href="https://fediring.net/next?host=andre.is-a.dev" aria-label="Próximo site do Fediring"
        >Próximo →</a
      >
    }
    @if (config.fediverseProfile) {
      <a [href]="config.fediverseProfile" rel="me noopener" target="_blank">Fediverso ↗</a>
    }
  </nav>
</ng-template>
<footer>
  @if (showPortrait()) {
    <app-footer-portrait><ng-container [ngTemplateOutlet]="links" /></app-footer-portrait>
  } @else {
  <div class="site-footer">
  <ng-container [ngTemplateOutlet]="links" />
  <div class="footer-brand">
    <app-wordmark />
  </div>
  <small>André Duarte · Minas Gerais, Brasil.</small>
  </div>
  }
</footer>
